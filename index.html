<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🇸🇦</title>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin-top: 25px;
        }

        button {
            background: white;
            color: #111;
            border: none;
            border-radius: 15px;
            padding: 15px 25px;
            font-size: 20px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        #cameraBox {
            position: relative;
            width: 90%;
            max-width: 700px;
            margin: auto;
            overflow: hidden;
            border-radius: 20px;
        }

        #camera {
            display: block;
            width: 100%;
            border-radius: 20px;
            transform: scaleX(-1);
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            transform: scaleX(-1);
        }

        /* الصورة داخل زاوية الكاميرا */
        #result {
            position: absolute;

            top: 15px;
            right: 15px;

            width: 120px;
            height: 120px;

            object-fit: contain;

            background: rgba(255, 255, 255, 0.92);

            padding: 5px;

            border-radius: 15px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);

            z-index: 5;

            transition: opacity 0.15s ease;
        }

        #result.hidden {
            display: none;
        }

    </style>

</head>

<body>

    <h1>🇸🇦</h1>

    <button onclick="startCamera()">
        تشغيل الكاميرا 📷
    </button>

    <div id="cameraBox">

        <video
            id="camera"
            autoplay
            playsinline>
        </video>

        <canvas id="canvas"></canvas>

        <!-- الصورة تظهر بالبداية -->
        <img
            id="result"
            src="https://raneem2fa-maker.github.io/Hand-gesture/open.jpeg"
            alt="الصورة"
        >

    </div>


    <script>

        const video =
            document.getElementById("camera");

        const canvas =
            document.getElementById("canvas");

        const ctx =
            canvas.getContext("2d");

        const resultImage =
            document.getElementById("result");


        // =====================================
        // الصور
        // =====================================

        const images = {

            OPEN:
                "https://raneem2fa-maker.github.io/Hand-gesture/open.jpeg",

            FIST:
                "https://raneem2fa-maker.github.io/Hand-gesture/fist.jpeg",

            PEACE:
                "https://raneem2fa-maker.github.io/Hand-gesture/peace.jpeg",

            THUMB:
                "https://raneem2fa-maker.github.io/Hand-gesture/thumb.jpeg",

            HEART:
                "https://raneem2fa-maker.github.io/Hand-gesture/finger-heart.jpeg",

            LEFT:
                "https://raneem2fa-maker.github.io/Hand-gesture/left-hand.jpeg",

            LOVE:
                "https://raneem2fa-maker.github.io/Hand-gesture/love.jpeg",

            ROCK:
                "https://raneem2fa-maker.github.io/Hand-gesture/rock.jpeg",

            CALL:
                "https://raneem2fa-maker.github.io/Hand-gesture/call.jpeg",

            ONE:
                "https://raneem2fa-maker.github.io/Hand-gesture/one.jpeg"

        };


        // =====================================
        // تثبيت الحركة
        // =====================================

        let lastGesture = null;

        let gestureFrames = 0;

        const REQUIRED_FRAMES = 5;


        // =====================================
        // MediaPipe
        // =====================================

        const hands = new Hands({

            locateFile: function(file) {

                return "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" + file;

            }

        });


        hands.setOptions({

            maxNumHands: 1,

            modelComplexity: 1,

            minDetectionConfidence: 0.75,

            minTrackingConfidence: 0.75

        });


        // =====================================
        // النتائج
        // =====================================

        hands.onResults(function(results) {

            canvas.width =
                video.videoWidth;

            canvas.height =
                video.videoHeight;


            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            // =================================
            // ما فيه يد
            // =================================

            if (
                !results.multiHandLandmarks ||
                results.multiHandLandmarks.length === 0
            ) {

                hideImage();

                lastGesture = null;

                gestureFrames = 0;

                return;
            }


            const landmarks =
                results.multiHandLandmarks[0];


            // =================================
            // رسم اليد
            // =================================

            drawConnectors(
                ctx,
                landmarks,
                HAND_CONNECTIONS,
                {
                    color: "#00ff88",
                    lineWidth: 5
                }
            );


            drawLandmarks(
                ctx,
                landmarks,
                {
                    color: "#ffffff",
                    fillColor: "#00ff88",
                    lineWidth: 2,
                    radius: 5
                }
            );


            // =================================
            // التعرف
            // =================================

            const gesture =
                recognizeGesture(landmarks);


            // إذا الحركة غير واضحة
            if (!gesture) {

                lastGesture = null;

                gestureFrames = 0;

                hideImage();

                return;
            }


            // =================================
            // تثبيت الحركة
            // =================================

            if (gesture === lastGesture) {

                gestureFrames++;

            }

            else {

                lastGesture = gesture;

                gestureFrames = 1;

            }


            // لا نغير الصورة إلا بعد ثبات الحركة
            if (gestureFrames >= REQUIRED_FRAMES) {

                showImage(images[gesture]);

            }

        });


        // =====================================
        // إظهار الصورة
        // =====================================

        function showImage(url) {

            resultImage.src = url;

            resultImage.classList.remove("hidden");

        }


        // =====================================
        // إخفاء الصورة
        // =====================================

        function hideImage() {

            resultImage.classList.add("hidden");

        }


        // =====================================
        // تشغيل الكاميرا
        // =====================================

        async function startCamera() {

            try {

                const stream =
                    await navigator.mediaDevices.getUserMedia({

                        video: {
                            facingMode: "user"
                        },

                        audio: false

                    });


                video.srcObject = stream;


                const camera =
                    new Camera(video, {

                        onFrame: async function() {

                            await hands.send({
                                image: video
                            });

                        },

                        width: 640,

                        height: 480

                    });


                camera.start();

            }

            catch (error) {

                console.error(error);

                alert(
                    "اسمحي للمتصفح باستخدام الكاميرا ثم حاولي مرة أخرى."
                );

            }

        }


        // =====================================
        // التعرف على الحركة
        // =====================================

        function recognizeGesture(lm) {

            const palmSize =
                distance(lm[0], lm[9]);


            // الأصابع الأربعة
            const index =
                fingerExtended(
                    lm[8],
                    lm[6],
                    lm[0],
                    palmSize
                );


            const middle =
                fingerExtended(
                    lm[12],
                    lm[10],
                    lm[0],
                    palmSize
                );


            const ring =
                fingerExtended(
                    lm[16],
                    lm[14],
                    lm[0],
                    palmSize
                );


            const pinky =
                fingerExtended(
                    lm[20],
                    lm[18],
                    lm[0],
                    palmSize
                );


            // الإبهام
            const thumb =
                thumbExtended(
                    lm,
                    palmSize
                );


            // =================================
            // 🫰🏻 قلب بالأصابع
            // لازم الإبهام والسبابة يكونون قريبين
            // =================================

            const pinch =
                distance(lm[4], lm[8]) <
                palmSize * 0.65;


            if (
                pinch &&
                !middle &&
                !ring &&
                !pinky
            ) {

                return "HEART";

            }


            // =================================
            // 🖐🏼 فتح اليد
            // =================================

            if (
                index &&
                middle &&
                ring &&
                pinky &&
                thumb
            ) {

                return "OPEN";

            }


            // =================================
            // ✊🏼 قبضة
            // =================================

            if (
                !index &&
                !middle &&
                !ring &&
                !pinky &&
                !thumb
            ) {

                return "FIST";

            }


            // =================================
            // ✌🏼 سلام
            // =================================

            if (
                index &&
                middle &&
                !ring &&
                !pinky &&
                !thumb
            ) {

                return "PEACE";

            }


            // =================================
            // ☝🏻 إصبع واحد
            // =================================

            if (
                index &&
                !middle &&
                !ring &&
                !pinky &&
                !thumb
            ) {

                return "ONE";

            }


            // =================================
            // 👍🏼 إبهام
            // =================================

            if (
                thumb &&
                !index &&
                !middle &&
                !ring &&
                !pinky
            ) {

                return "THUMB";

            }


            // =================================
            // 🤟🏼 أحبك
            // =================================

            if (
                thumb &&
                index &&
                !middle &&
                !ring &&
                pinky
            ) {

                return "LOVE";

            }


            // =================================
            // 🤘🏼 روك
            // =================================

            if (
                index &&
                !middle &&
                !ring &&
                pinky &&
                !thumb
            ) {

                return "ROCK";

            }


            // =================================
            // 🤙🏼 اتصال
            // =================================

            if (
                thumb &&
                !index &&
                !middle &&
                !ring &&
                pinky
            ) {

                return "CALL";

            }


            // =================================
            // 🫲🏻
            // =================================

            if (
                !index &&
                middle &&
                ring &&
                pinky &&
                !thumb
            ) {

                return "LEFT";

            }


            return null;

        }


        // =====================================
        // هل الإصبع ممدود؟
        // =====================================

        function fingerExtended(
            tip,
            pip,
            wrist,
            palmSize
        ) {

            const tipDistance =
                distance(tip, wrist);

            const pipDistance =
                distance(pip, wrist);


            return (
                tipDistance >
                pipDistance * 1.12
            );

        }


        // =====================================
        // الإبهام
        // =====================================

        function thumbExtended(
            lm,
            palmSize
        ) {

            const thumbTip =
                lm[4];

            const thumbIP =
                lm[3];

            const indexMCP =
                lm[5];

            const tipToIndex =
                distance(
                    thumbTip,
                    indexMCP
                );

            const ipToIndex =
                distance(
                    thumbIP,
                    indexMCP
                );


            return (
                tipToIndex >
                ipToIndex * 1.15
            );

        }


        // =====================================
        // المسافة بين نقطتين
        // =====================================

        function distance(a, b) {

            const dx =
                a.x - b.x;

            const dy =
                a.y - b.y;

            const dz =
                (a.z || 0) -
                (b.z || 0);


            return Math.sqrt(
                dx * dx +
                dy * dy +
                dz * dz
            );

        }

    </script>

</body>

</html>
