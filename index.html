<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🇸🇦</title>

    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin-top: 25px;
        }

        button {
            background: white;
            color: #111;
            border: none;
            border-radius: 15px;
            padding: 15px 25px;
            font-size: 20px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        button:active {
            transform: scale(0.95);
        }

        /* مكان الكاميرا */
        #cameraBox {
            position: relative;
            width: 90%;
            max-width: 700px;
            margin: auto;
        }

        /* الكاميرا */
        #camera {
            display: block;
            width: 100%;
            border-radius: 20px;
            transform: scaleX(-1);
        }

        /* خطوط اليد */
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            transform: scaleX(-1);
        }

        /* الصورة */
        #result {
            display: block;
            width: 80%;
            max-width: 400px;
            max-height: 400px;
            object-fit: contain;
            border-radius: 20px;
            margin: 25px auto;
        }

    </style>

</head>

<body>

    <h1>🇸🇦</h1>

    <button onclick="startCamera()">
        تشغيل الكاميرا 📷
    </button>

    <div id="cameraBox">

        <video
            id="camera"
            autoplay
            playsinline>
        </video>

        <canvas id="canvas"></canvas>

    </div>

    <!-- الصورة ظاهرة من البداية -->
    <img
        id="result"
        src="https://raneem2fa-maker.github.io/Hand-gesture/open.jpeg"
        alt="الصورة"
    >


    <script>

        const video =
            document.getElementById("camera");

        const canvas =
            document.getElementById("canvas");

        const ctx =
            canvas.getContext("2d");

        const resultImage =
            document.getElementById("result");


        // =====================================
        // الصور
        // =====================================

        const images = {

            OPEN:
                "https://raneem2fa-maker.github.io/Hand-gesture/open.jpeg",

            FIST:
                "https://raneem2fa-maker.github.io/Hand-gesture/fist.jpeg",

            PEACE:
                "https://raneem2fa-maker.github.io/Hand-gesture/peace.jpeg",

            THUMB:
                "https://raneem2fa-maker.github.io/Hand-gesture/thumb.jpeg",

            HEART:
                "https://raneem2fa-maker.github.io/Hand-gesture/finger-heart.jpeg",

            LEFT:
                "https://raneem2fa-maker.github.io/Hand-gesture/left-hand.jpeg",

            LOVE:
                "https://raneem2fa-maker.github.io/Hand-gesture/love.jpeg",

            ROCK:
                "https://raneem2fa-maker.github.io/Hand-gesture/rock.jpeg",

            CALL:
                "https://raneem2fa-maker.github.io/Hand-gesture/call.jpeg",

            ONE:
                "https://raneem2fa-maker.github.io/Hand-gesture/one.jpeg"

        };


        // =====================================
        // MediaPipe Hands
        // =====================================

        const hands = new Hands({

            locateFile: function(file) {

                return "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" + file;

            }

        });


        hands.setOptions({

            maxNumHands: 1,

            modelComplexity: 1,

            minDetectionConfidence: 0.7,

            minTrackingConfidence: 0.7

        });


        // =====================================
        // نتائج الكاميرا
        // =====================================

        hands.onResults(function(results) {

            // ضبط حجم الرسم
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;


            // تنظيف الخطوط القديمة
            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            // =================================
            // إذا فيه يد
            // =================================

            if (
                results.multiHandLandmarks &&
                results.multiHandLandmarks.length > 0
            ) {

                const landmarks =
                    results.multiHandLandmarks[0];


                // رسم خطوط اليد
                drawConnectors(
                    ctx,
                    landmarks,
                    HAND_CONNECTIONS,
                    {
                        color: "#00ff88",
                        lineWidth: 5
                    }
                );


                // رسم نقاط المفاصل
                drawLandmarks(
                    ctx,
                    landmarks,
                    {
                        color: "#ffffff",
                        fillColor: "#00ff88",
                        lineWidth: 2,
                        radius: 5
                    }
                );


                // التعرف على الحركة
                const gesture =
                    recognizeGesture(landmarks);


                // تغيير الصورة إذا عرف الحركة
                if (gesture === "OPEN") {

                    resultImage.src =
                        images.OPEN;

                }

                else if (gesture === "FIST") {

                    resultImage.src =
                        images.FIST;

                }

                else if (gesture === "PEACE") {

                    resultImage.src =
                        images.PEACE;

                }

                else if (gesture === "THUMB") {

                    resultImage.src =
                        images.THUMB;

                }

                else if (gesture === "HEART") {

                    resultImage.src =
                        images.HEART;

                }

                else if (gesture === "LEFT") {

                    resultImage.src =
                        images.LEFT;

                }

                else if (gesture === "LOVE") {

                    resultImage.src =
                        images.LOVE;

                }

                else if (gesture === "ROCK") {

                    resultImage.src =
                        images.ROCK;

                }

                else if (gesture === "CALL") {

                    resultImage.src =
                        images.CALL;

                }

                else if (gesture === "ONE") {

                    resultImage.src =
                        images.ONE;

                }

            }

            // إذا ما فيه يد:
            // نخلي الصورة كما هي ولا نخفيها

        });


        // =====================================
        // تشغيل الكاميرا
        // =====================================

        async function startCamera() {

            try {

                const stream =
                    await navigator.mediaDevices.getUserMedia({

                        video: {
                            facingMode: "user"
                        },

                        audio: false

                    });


                video.srcObject = stream;


                const camera =
                    new Camera(video, {

                        onFrame: async function() {

                            await hands.send({
                                image: video
                            });

                        },

                        width: 640,

                        height: 480

                    });


                camera.start();

            }

            catch (error) {

                console.error(error);

                alert(
                    "اسمحي للمتصفح باستخدام الكاميرا ثم حاولي مرة أخرى."
                );

            }

        }


        // =====================================
        // التعرف على الحركات
        // =====================================

        function recognizeGesture(lm) {

            const thumb =
                lm[4].x < lm[3].x;


            const index =
                isFingerUp(lm[8], lm[6]);


            const middle =
                isFingerUp(lm[12], lm[10]);


            const ring =
                isFingerUp(lm[16], lm[14]);


            const pinky =
                isFingerUp(lm[20], lm[18]);


            // 🖐🏼 فتح اليد
            if (
                index &&
                middle &&
                ring &&
                pinky
            ) {

                return "OPEN";

            }


            // ✊🏼 قبضة
            if (
                !index &&
                !middle &&
                !ring &&
                !pinky
            ) {

                return "FIST";

            }


            // ✌🏼 سلام
            if (
                index &&
                middle &&
                !ring &&
                !pinky
            ) {

                return "PEACE";

            }


            // ☝🏻 إصبع واحد
            if (
                index &&
                !middle &&
                !ring &&
                !pinky
            ) {

                return "ONE";

            }


            // 👍🏼 إبهام
            if (
                thumb &&
                !index &&
                !middle &&
                !ring &&
                !pinky
            ) {

                return "THUMB";

            }


            // 🫰🏻 قلب بالأصابع
            if (
                index &&
                middle &&
                !ring &&
                pinky
            ) {

                return "HEART";

            }


            // 🤟🏼 أحبك
            if (
                thumb &&
                index &&
                !middle &&
                !ring &&
                pinky
            ) {

                return "LOVE";

            }


            // 🤘🏼 روك
            if (
                index &&
                !middle &&
                !ring &&
                pinky
            ) {

                return "ROCK";

            }


            // 🤙🏼 اتصل
            if (
                thumb &&
                !index &&
                !middle &&
                !ring &&
                pinky
            ) {

                return "CALL";

            }


            // 🫲🏻 اليد اليسرى
            if (
                !index &&
                middle &&
                ring &&
                pinky
            ) {

                return "LEFT";

            }


            return null;

        }


        // =====================================
        // معرفة إذا الإصبع مرفوع
        // =====================================

        function isFingerUp(tip, pip) {

            return tip.y < pip.y;

        }

    </script>

</body>

</html>
